[package]
name = "rudolfs"
version = "0.3.8"
authors = ["Jason White <rust@jasonwhite.io>"]
edition = "2024"
description = """
A high-performance, caching Git LFS server with an AWS S3 back-end.
"""
documentation = "https://github.com/jasonwhite/rudolfs"
homepage = "https://github.com/jasonwhite/rudolfs"
repository = "https://github.com/jasonwhite/rudolfs"
readme = "README.md"
keywords = ["git-lfs", "s3"]
categories = ["command-line-utilities"]
license = "MIT"

[dependencies]
askama = "0.14"
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
backoff = { version = "0.4", features = ["tokio"] }
bytes = "1"
chacha = "0.4"
derive_more = { version = "2", features = ["display", "from"] }
futures = "0.3"
hex = "0.4"
human-size = "0.4"
humansize = "2"
humantime = "2"
hyper = { version = "0.14", features = ["server", "http1", "http2", "tcp", "stream"] }
linked-hash-map = { version = "0.5", features = ["serde_impl"] }
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0-rc.3"
structopt = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.1", features = ["v4"] }
hybrid-array = "0.4"

[dev-dependencies]
rand = "0.9"
tempfile = "3"
duct = "1.1"
toml = "0.9"

[dependencies.aws-config]
version = "1"
features = ["behavior-version-latest", "rustls", "rt-tokio"]
default-features = false

[dependencies.aws-sdk-s3]
version = "1.146.0"
features = ["rustls"]
default-features = false

[features]
default = []
# If the "faulty" feature is enabled, random failures are injected into the byte
# stream.
faulty = ["rand"]
